databaseChangeLog:
  - changeSet:
      id: create-outbox-messages
      author: vitzemtsov
      changes:

        - createTable:
            tableName: outbox_messages
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: sent_at
                  type: TIMESTAMP

              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: VARCHAR(1000)
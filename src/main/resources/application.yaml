app:
  outbox:
    fixed-delay: 1000
  pdf:
    font-path: classpath:fonts/arialmt.ttf
spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    topics:
      output-events: output-events
      input-events: input-events
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:29092}
    consumer:
      group-id: file-converter-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.vitzemtsov.fileconverter.inbox.dto.MinioNotification
        spring.json.trusted.packages: com.vitzemtsov.fileconverter
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_converter_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

minio:
  endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
  bucket: files
  result-bucket: pdf-files
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    org.springframework: INFO
    com.example.converter: DEBUG
    org.apache.kafka: WARN
    io.minio: DEBUG

